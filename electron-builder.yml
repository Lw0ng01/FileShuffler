appId: com.lucaswong.fileshuffler
productName: FileShuffler
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md}'
  # Excluded by folder, not by filename. The old list named `PROJECT.md` at the repository root, so
  # moving it into `docs/` would have silently stopped matching and shipped it inside every build -
  # and it records real measurements from a real machine, which is the one thing it must not do.
  # `LICENSE` and `THIRD-PARTY-NOTICES.md` are deliberately *not* excluded: those should travel with
  # the app.
  - '!docs'
  # Git worktrees live in `.claude/worktrees/`, inside the project folder, each with its own
  # checkout and its own `dist/`. Without this, a build packages them: a real one came out at 489 MB
  # instead of 122 MB because the app contained a complete copy of a previous build of itself, that
  # checkout's `CLAUDE.md`, and - the part that matters - its `docs/PROJECT.md`. The `!docs` rule
  # above only ever matched at the root, so a nested copy walked straight past it.
  - '!.claude'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: FileShuffler
nsis:
  artifactName: FileShuffler-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Ad-hoc signing, because there is no Developer ID (PROJECT.md §7 Phase 6). Without this the app
  # keeps only the signature the linker left: the signing identifier stays `Electron`, no resources
  # are sealed, and macOS calls the result damaged rather than merely unidentified. Ad-hoc does not
  # satisfy Gatekeeper either - nothing but a Developer ID does - but it makes the bundle valid, so
  # a download opens with the ordinary "unidentified developer" prompt that right-click, Open clears.
  identity: '-'
  # Off while the signature is ad-hoc. The hardened runtime exists to make notarization possible,
  # and notarization needs a Developer ID we do not have - so it earns nothing here, while breaking
  # the app: an ad-hoc signature has no team identity, so library validation rejects Electron's own
  # frameworks and the app fails to launch. The alternative electron-builder suggests is the
  # `com.apple.security.cs.disable-library-validation` entitlement, which is a protection switched
  # off rather than a feature left unused. **Set this back to true the day a Developer ID exists**;
  # notarization requires it.
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: FileShuffler reads your Documents folder to list files.
    - NSDownloadsFolderUsageDescription: FileShuffler reads your Downloads folder to list files.
    - NSDesktopFolderUsageDescription: FileShuffler reads your Desktop folder to list files.
    - NSRemovableVolumesUsageDescription: FileShuffler reads external drives to list files.
  notarize: false
dmg:
  # `${productName}`, not `${name}`: the package name is `file-shuffler`, which made the release
  # offer `file-shuffler-1.0.0.dmg` beside `FileShuffler-Setup-1.0.0.exe`. One product, one spelling.
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
# No `publish` block on purpose: the app makes no network calls (PROJECT.md §2.7).
